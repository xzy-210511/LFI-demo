spring.application.name=lfi-dashboard-backend
server.port=8080
spring.servlet.multipart.max-file-size=3GB
spring.servlet.multipart.max-request-size=3GB
server.error.include-message=always

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lfi_dashboard}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lfi_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lfi_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

hdf5.python-command=${HDF5_PYTHON_COMMAND:python}
hdf5.processor-script=${HDF5_PROCESSOR_SCRIPT:tools/hdf5_processor.py}
hdf5.cache-directory=${HDF5_CACHE_DIRECTORY:${java.io.tmpdir}/lfi-hdf5-cache}
